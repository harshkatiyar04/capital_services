<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Worker dashboard | Capital Services</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/ops.css">
  <script type="module" src="js/crew-app.js"></script>
</head>
<body class="ops-body">
  <div class="ops-shell">
    <header class="ops-top">
      <a class="ops-brand" href="team.html">
        <img src="https://res.cloudinary.com/foxrj3tm/image/upload/f_auto,q_auto/v1787939389/capital-services/logos/capital-services-logo.jpg" alt="Capital Services">
        <span class="ops-brand-copy">
          <small>Worker</small>
          <strong>Dashboard</strong>
        </span>
      </a>
      <div class="ops-top-links">
        <span id="who"></span>
        <button type="button" class="ops-link" id="logout-btn">Sign out</button>
      </div>
    </header>
    <div id="board">
      <div class="ops-wait" role="status" aria-live="polite">
        <div>
          <div class="ops-spinner" aria-hidden="true"></div>
          <p class="ops-kicker">Worker</p>
          <h1 class="ops-title">Opening your dashboard</h1>
          <p>This usually takes a few seconds.</p>
        </div>
      </div>
    </div>
  </div>

  <div class="ops-overlay ops-hidden" id="review-overlay" role="dialog" aria-modal="true">
    <div class="ops-overlay-card">
      <div class="ops-overlay-bar">
        <div>
          <p class="ops-kicker">Hand the phone over</p>
          <h2 id="review-title">Collect review</h2>
        </div>
        <button type="button" class="ops-link" id="close-review">Close</button>
      </div>
      <form id="review-form"></form>
    </div>
  </div>
</body>
</html>
